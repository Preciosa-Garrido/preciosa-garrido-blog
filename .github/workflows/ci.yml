name: Tests

on:
  pull_request:
  push:
    branches: [master, 'feature/**']
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: exif, gd, intl, mysqli, zip
          coverage: none
      - name: Validate dependency manifest
        run: composer validate --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Check PHP syntax
        shell: bash
        run: find wp-content/themes/preciosagarrido -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate production image
        run: docker build --tag preciosa-garrido-blog:test .
