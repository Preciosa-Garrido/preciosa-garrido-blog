name: Publish and deploy image

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Select deployment target
        id: target
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "environment=prd" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable image reference
        id: image
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "value=ghcr.io/${REPOSITORY}:${VERSION}" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ needs.publish.outputs.environment }}
    env:
      KUBECONFIG_CI: ${{ secrets.KUBECONFIG_CI }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT }}
      K8S_CONTAINER: ${{ vars.K8S_CONTAINER }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$KUBECONFIG_CI"
          test -n "$K8S_NAMESPACE"
          test -n "$K8S_DEPLOYMENT"
          test -n "$K8S_CONTAINER"
      - name: Configure Kubernetes
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CI" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy image
        run: >-
          kubectl set image deployment/$K8S_DEPLOYMENT
          $K8S_CONTAINER=${{ needs.publish.outputs.image }}
          --namespace=$K8S_NAMESPACE
      - name: Verify rollout
        run: >-
          kubectl rollout status deployment/$K8S_DEPLOYMENT
          --namespace=$K8S_NAMESPACE
          --timeout=5m
